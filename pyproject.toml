[tool.poetry]
name = "project-2"
version = "0.1.0"
description = "project_2"
authors = ["Semyon <semyon@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.115.14,<0.116.0"
sqlalchemy = ">=2.0.41,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
uvicorn = ">=0.35.0,<0.36.0"
alembic = ">=1.16.2,<2.0.0"
python-decouple = ">=3.8,<4.0"
greenlet = ">=3.2.3,<4.0.0"
pre-commit = ">=4.2.0,<5.0.0"
faststream = {version = ">=0.5.45,<0.6.0", extras = ["rabbit"]}
pydantic = {version = ">=2.11.7,<3.0.0", extras = ["email"]}
pydantic-extra-types = ">=2.10.5,<3.0.0"
phonenumbers = ">=9.0.8,<10.0.0"
passlib = ">=1.7.4,<2.0.0"
bcrypt = "<4.0"
python-multipart = ">=0.0.20,<0.0.21"
python-jose = ">=3.5.0,<4.0.0"
celery = {version = ">=5.5.3,<6.0.0", extras = ["redis"]}
tzdata = ">=2025.2,<2026.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
jinja2 = ">=3.1.6,<4.0.0"
boto3 = ">=1.39.4,<2.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.3"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
