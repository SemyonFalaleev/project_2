services:
  app:
    build: .
    container_name: "app"
    networks:
      - custom
    ports:
      - "8000:8000"
    environment: &default_env
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@db:5432/postgres"
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/postgres 
      TOKEN_EXPIRE: 60
      TOKEN_EMAIL_EXPIRE: 15
      SECRET_KEY_JWT: supersecretkey123456789!@$
      ALGORITM_JWT: HS256
      PATH_TO_PERMISSION_JSON: permission.json
      RABBITMQ_URL: amqp://guest:guest@rabbit:5672/
      EMAIL_SENDER: cemo_013@mail.ru
      PASSWD_EMAIL_SENDER: BuQIArp5qwcm6pTRK3y9
      EMAIL_SERVER_ADDR: smtp.mail.ru
      EMAIL_SERVER_PORT: 587
      AWS_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

  worker:
    build: .
    container_name: "celery_worker"
    command: ["poetry", "run", "celery", "-A", "src.utils.celery.celery_config:celery_app", "worker", "--loglevel=info"]
    depends_on:
      - app
      - rabbit
      - db
    environment:
      <<: *default_env
    networks:
      - custom

  beat:
    build: .
    container_name: "celery_beat"
    command: ["poetry", "run", "celery", "-A", "src.utils.celery.shedule:celery_app", "beat", "--loglevel=info"]
    depends_on:
      - app
      - rabbit
      - db
    environment:
      <<: *default_env
    networks:
      - custom
    
  db: 
    container_name: "db"
    image: postgres:14.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports: 
      - "5433:5432"
    networks: 
      - custom
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbit:
    container_name: "rabbitmq"
    image: "rabbitmq:3-management"
    networks:
      - custom
    ports: 
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    networks:
      - custom
    ports:
      - "9000:9000"       
      - "9001:9001"       
    environment:
      MINIO_ROOT_USER: minioadmin       # логин
      MINIO_ROOT_PASSWORD: minioadmin   # пароль
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data
  
networks:
  custom:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:






